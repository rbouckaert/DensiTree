name: Java CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          java-package: jdk+fx
      - name: Build with Ant
        run: ant -noinput -buildfile build.xml compile
