name: Java CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: 11
          java-package: jdk+fx
          distribution: zulu
      - name: Build with Ant
        run: ant -noinput -buildfile build.xml compile
